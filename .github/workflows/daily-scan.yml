name: Daily MACD cross forecast

on:
  schedule:
    # 22:30 UTC Mon-Fri = after the US close (18:30 EDT / 17:30 EST)
    - cron: "30 22 * * 1-5"
  workflow_dispatch:
    inputs:
      args:
        description: "Extra arguments for screener.cross_scan (e.g. --min-prob 0.6)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run scan
        env:
          SCAN_ARGS: ${{ github.event.inputs.args }}
        run: python -m screener.cross_scan $SCAN_ARGS

      - name: Job summary
        run: cat results/latest.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: macd-cross-forecast-${{ github.run_id }}
          path: results/

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/
          git diff --cached --quiet || git commit -m "Daily MACD cross forecast $(date -u +%F)"
          git push

      - name: Send to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m screener.notify_telegram
